<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" dir="ltr">
<head>
  {{ partial "head.html" . }}
</head>
<body class="flex min-h-screen flex-col bg-white text-slate-900">
  {{ partial "header.html" . }}
  {{- block "main" . }}{{- end }}
  {{ partial "footer.html" . }}

  {{ $bundle := resources.Get "javascript/script.js" | minify | fingerprint }}
  <script defer src="{{ $bundle.RelPermalink }}" integrity="{{ $bundle.Data.Integrity }}"></script>
</body>
</html>
