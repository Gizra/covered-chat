- title: "Sick calls covered in minutes"
  text: "Someone can't make it? Covered texts the staff who can work that shift, in the order you prefer, and tells you when it's filled. No group texts, no phone tree."
- title: "Your schedule, in a conversation"
  text: "Ask \"Who can cover Sunday?\", \"Draft next week's FOH\" or \"Give Ana Friday off\". Covered reads the schedule, does the work and asks before anything goes out."
- title: "Nothing for staff to install"
  text: "Offers, published schedules and pickups arrive by text. Staff reply to call in sick, ask for time off or grab an open shift, and each has their own schedule page."
- title: "Your rules, every time"
  text: "Covered knows who's certified for each role, who works FOH or BOH, your standard week and who's off, and warns you before anyone is double-booked."
