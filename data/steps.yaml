- title: "Set up once"
  text: "Your roles, shifts and standard week, imported from the schedule you already keep."
- title: "Draft and publish each week"
  text: "Covered drafts the week from your standard week. You adjust it in the chat, then publish, and each person gets their shifts by text."
- title: "Let Covered handle changes"
  text: "Sick calls, swaps and open shifts are handled by text, with a heads-up to you, and the schedule stays current."
